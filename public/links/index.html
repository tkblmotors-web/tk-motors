<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TK MOTORS — Liens</title>
<style>
  :root{
    --navy:#0a1a33;
    --navy-deep:#050d1a;
    --chrome-1:#f5f7fa;
    --chrome-2:#c9d2dc;
    --chrome-3:#8b96a3;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  html,body{height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100%;
    background: radial-gradient(ellipse at top, var(--navy) 0%, var(--navy-deep) 75%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    justify-content:center;
    padding: 36px 18px calc(36px + env(safe-area-inset-bottom, 0px));
  }
  main{
    width:100%;
    max-width:480px;
    text-align:center;
  }
  .logo-wrap{
    width:96px;
    height:96px;
    margin: 0 auto 14px;
    border-radius: 22px;
    background: var(--chrome-1);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    overflow:hidden;
  }
  .logo-wrap img{
    width:100%;
    height:100%;
    object-fit: contain;
    padding: 8px;
  }
  h1{
    margin: 0 0 4px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(180deg, var(--chrome-1) 0%, var(--chrome-3) 45%, var(--chrome-1) 55%, var(--chrome-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.tagline{
    color: var(--chrome-2);
    font-size: 13px;
    letter-spacing: 1px;
    margin: 0 0 28px;
  }
  a.link{
    display:flex;
    align-items:center;
    gap: 14px;
    text-decoration:none;
    color: var(--chrome-1);
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(200,210,220,0.25);
    border-radius: 14px;
    padding: 15px 18px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  a.link:active{ transform: scale(0.98); background: rgba(255,255,255,0.12); }
  .icon{
    width:24px;
    height:24px;
    flex: 0 0 24px;
  }
  .icon svg{ width:100%; height:100%; display:block; }
  footer{
    margin-top: 26px;
    color: var(--chrome-3);
    font-size: 11px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<main>

  <div class="logo-wrap">
    <img src="/tk-motors-logo.png" alt="TK MOTORS logo">
  </div>

  <h1>TK MOTORS</h1>
  <p class="tagline">IMPORT DE VOITURES CORÉENNES 🇰🇷 → 🇩🇿</p>

  <a class="link" href="https://wa.me/821025107410">
    <span class="icon">
      <svg viewBox="0 0 24 24" fill="#25D366">
